<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f0f0f0" />
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Azure Active-Active Application Architecture</text>
  
  <!-- Azure Cloud Border -->
  <rect x="50" y="70" width="900" height="580" rx="10" ry="10" fill="#ffffff" stroke="#0078d4" stroke-width="2" stroke-dasharray="5,5" />
  <text x="100" y="100" font-family="Arial" font-size="18" fill="#0078d4">Azure Cloud</text>
  
  <!-- Primary Region - East US -->
  <rect x="80" y="130" width="380" height="480" rx="10" ry="10" fill="#ebf3fb" stroke="#0078d4" stroke-width="2" />
  <text x="270" y="160" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Primary Region (East US)</text>
  
  <!-- Secondary Region - West US -->
  <rect x="540" y="130" width="380" height="480" rx="10" ry="10" fill="#ebf3fb" stroke="#0078d4" stroke-width="2" />
  <text x="730" y="160" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Secondary Region (West US)</text>
  
  <!-- Global Resources -->
  <rect x="220" y="620" width="560" height="100" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="2" />
  <text x="500" y="640" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Global Resources</text>
  
  <!-- Traffic Manager -->
  <circle cx="500" cy="120" r="40" fill="#ffffff" stroke="#0078d4" stroke-width="2" />
  <text x="500" y="125" font-family="Arial" font-size="10" text-anchor="middle">Traffic</text>
  <text x="500" y="135" font-family="Arial" font-size="10" text-anchor="middle">Manager</text>
  
  <!-- Primary Region Resources -->
  <!-- Resource Group -->
  <rect x="100" y="170" width="340" height="420" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" stroke-dasharray="5,5" />
  <text x="120" y="190" font-family="Arial" font-size="12" fill="#555555">Resource Group: app-eastus-rg</text>
  
  <!-- App Service Plan -->
  <rect x="120" y="200" width="300" height="100" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="270" y="220" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">App Service Plan (P1v2)</text>
  
  <!-- App Service -->
  <rect x="140" y="230" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="200" y="260" font-family="Arial" font-size="10" text-anchor="middle">App Service</text>
  <text x="200" y="275" font-family="Arial" font-size="8" text-anchor="middle">app-eastus-prod</text>
  
  <!-- Container Registry -->
  <rect x="280" y="230" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="340" y="275" font-family="Arial" font-size="8" text-anchor="middle">acrActiveActive</text>
  
  <!-- SQL Server -->
  <rect x="120" y="310" width="300" height="140" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="270" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Database Resources</text>
  
  <!-- Primary DB -->
  <rect x="140" y="340" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="200" y="370" font-family="Arial" font-size="10" text-anchor="middle">SQL Server</text>
  <text x="200" y="385" font-family="Arial" font-size="8" text-anchor="middle">Primary</text>
  
  <!-- Geo-Replicated DB -->
  <rect x="280" y="340" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="340" y="370" font-family="Arial" font-size="10" text-anchor="middle">SQL Database</text>
  <text x="340" y="385" font-family="Arial" font-size="8" text-anchor="middle">Geo-Replicated</text>
  
  <!-- Application Insights -->
  <rect x="140" y="410" width="260" height="30" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="270" y="430" font-family="Arial" font-size="10" text-anchor="middle">Application Insights</text>
  
  <!-- Key Vault -->
  <rect x="120" y="460" width="140" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="190" y="490" font-family="Arial" font-size="10" text-anchor="middle">Key Vault</text>
  
  <!-- Cache -->
  <rect x="280" y="460" width="140" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="350" y="490" font-family="Arial" font-size="10" text-anchor="middle">Redis Cache</text>
  
  <!-- Storage Account -->
  <rect x="120" y="530" width="300" height="40" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="270" y="555" font-family="Arial" font-size="10" text-anchor="middle">Storage Account (Geo-Redundant)</text>
  
  <!-- Secondary Region Resources -->
  <!-- Resource Group -->
  <rect x="560" y="170" width="340" height="420" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" stroke-dasharray="5,5" />
  <text x="580" y="190" font-family="Arial" font-size="12" fill="#555555">Resource Group: app-westus-rg</text>
  
  <!-- App Service Plan -->
  <rect x="580" y="200" width="300" height="100" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="730" y="220" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">App Service Plan (P1v2)</text>
  
  <!-- App Service -->
  <rect x="600" y="230" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="660" y="260" font-family="Arial" font-size="10" text-anchor="middle">App Service</text>
  <text x="660" y="275" font-family="Arial" font-size="8" text-anchor="middle">app-westus-prod</text>
  
  <!-- Container Registry (Replicated) -->
  <rect x="740" y="230" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" stroke-dasharray="3,3" />
  <text x="800" y="260" font-family="Arial" font-size="10" text-anchor="middle">Container Registry</text>
  <text x="800" y="275" font-family="Arial" font-size="8" text-anchor="middle">Replicated</text>
  
  <!-- SQL Server -->
  <rect x="580" y="310" width="300" height="140" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="730" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Database Resources</text>
  
  <!-- Secondary DB -->
  <rect x="600" y="340" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="660" y="370" font-family="Arial" font-size="10" text-anchor="middle">SQL Server</text>
  <text x="660" y="385" font-family="Arial" font-size="8" text-anchor="middle">Secondary</text>
  
  <!-- Geo-Replicated DB -->
  <rect x="740" y="340" width="120" height="60" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" stroke-dasharray="3,3" />
  <text x="800" y="370" font-family="Arial" font-size="10" text-anchor="middle">SQL Database</text>
  <text x="800" y="385" font-family="Arial" font-size="8" text-anchor="middle">Replica</text>
  
  <!-- Application Insights -->
  <rect x="600" y="410" width="260" height="30" rx="5" ry="5" fill="#e6f7ff" stroke="#0078d4" stroke-width="1" />
  <text x="730" y="430" font-family="Arial" font-size="10" text-anchor="middle">Application Insights</text>
  
  <!-- Key Vault -->
  <rect x="580" y="460" width="140" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="650" y="490" font-family="Arial" font-size="10" text-anchor="middle">Key Vault</text>
  
  <!-- Cache -->
  <rect x="740" y="460" width="140" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="810" y="490" font-family="Arial" font-size="10" text-anchor="middle">Redis Cache</text>
  
  <!-- Storage Account -->
  <rect x="580" y="530" width="300" height="40" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="730" y="555" font-family="Arial" font-size="10" text-anchor="middle">Storage Account (Geo-Redundant)</text>
  
  <!-- Global Resources Components -->
  <!-- Traffic Manager -->
  <rect x="240" y="650" width="150" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="315" y="680" font-family="Arial" font-size="10" text-anchor="middle">Traffic Manager Profile</text>
  <text x="315" y="695" font-family="Arial" font-size="8" text-anchor="middle">Performance Routing</text>
  
  <!-- Azure Monitor -->
  <rect x="410" y="650" width="150" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="485" y="680" font-family="Arial" font-size="10" text-anchor="middle">Azure Monitor</text>
  <text x="485" y="695" font-family="Arial" font-size="8" text-anchor="middle">Alerts &amp; Dashboards</text>
  
  <!-- Azure DevOps -->
  <rect x="580" y="650" width="150" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1" />
  <text x="655" y="680" font-family="Arial" font-size="10" text-anchor="middle">Azure DevOps</text>
  <text x="655" y="695" font-family="Arial" font-size="8" text-anchor="middle">CI/CD Pipeline</text>
  
  <!-- Connections and Lines -->
  <!-- Remove all existing traffic flow elements and animations -->
  
  <!-- Simplified Traffic Flow -->
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078d4"/>
    </marker>
  </defs>

  <!-- Essential Traffic Flow -->
  <!-- 1. User to Traffic Manager -->
  <line x1="450" y1="50" x2="500" y2="100" 
        stroke="#0078d4" stroke-width="2" marker-end="url(#flow-arrow)"/>
  <circle cx="450" cy="50" r="12" fill="white" stroke="#0078d4" stroke-width="2"/>
  <text x="450" y="54" font-family="Arial" font-size="12" text-anchor="middle">1</text>

  <!-- 2. Traffic Manager Distribution -->
  <path d="M 500,120 C 450,160 300,200 200,260" 
        stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/>
  <path d="M 500,120 C 550,160 700,200 800,260" 
        stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/>
  <circle cx="500" cy="120" r="12" fill="white" stroke="#0078d4" stroke-width="2"/>
  <text x="500" y="124" font-family="Arial" font-size="12" text-anchor="middle">2</text>

  <!-- 3. Database Replication -->
  <line x1="260" y1="370" x2="600" y2="370" 
        stroke="#0078d4" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="430" cy="370" r="12" fill="white" stroke="#0078d4" stroke-width="2"/>
  <text x="430" y="374" font-family="Arial" font-size="12" text-anchor="middle">3</text>

  <!-- Flow Labels -->
  <g font-family="Arial" font-size="11" fill="#0078d4">
    <text x="440" y="35">1. User Request</text>
    <text x="530" y="110">2. Load Distribution</text>
    <text x="430" y="350">3. Geo-Replication</text>
  </g>

  <!-- Updated Legend -->
  <rect x="780" y="50" width="170" height="80" rx="5" ry="5" fill="#ffffff" stroke="#555555" stroke-width="1"/>
  <text x="790" y="70" font-family="Arial" font-size="12" font-weight="bold">Traffic Flow</text>
  <g transform="translate(790,85)">
    <circle cx="5" cy="0" r="8" fill="white" stroke="#0078d4" stroke-width="2"/>
    <text x="20" y="4" font-family="Arial" font-size="10">Flow Step</text>
    <text x="5" y="4" font-family="Arial" font-size="8" text-anchor="middle">1</text>
  </g>

  <!-- Remove old connections and add new comprehensive traffic flow -->
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078d4"/>
    </marker>
    <marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00b300"/>
    </marker>
    <marker id="sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8c00"/>
    </marker>
  </defs>

  <!-- User Traffic Flow -->
  <!-- 1. Initial Request -->
  <path d="M 450,50 Q 480,80 500,100" stroke="#0078d4" stroke-width="2" marker-end="url(#request-arrow)" fill="none"/>
  <circle cx="450" cy="50" r="12" fill="white" stroke="#0078d4" stroke-width="2"/>
  <text x="450" y="54" font-family="Arial" font-size="12" text-anchor="middle">1</text>

  <!-- 2. Traffic Manager Distribution -->
  <path d="M 500,120 Q 400,180 200,260" stroke="#0078d4" stroke-width="2" marker-end="url(#request-arrow)" fill="none"/>
  <path d="M 500,120 Q 600,180 800,260" stroke="#0078d4" stroke-width="2" marker-end="url(#request-arrow)" fill="none"/>
  <circle cx="500" cy="120" r="12" fill="white" stroke="#0078d4" stroke-width="2"/>
  <text x="500" y="124" font-family="Arial" font-size="12" text-anchor="middle">2</text>

  <!-- 3. App Service Operations -->
  <path d="M 200,290 C 200,320 200,330 200,340" stroke="#0078d4" stroke-width="2" marker-end="url(#request-arrow)" fill="none"/>
  <path d="M 800,290 C 800,320 800,330 800,340" stroke="#0078d4" stroke-width="2" marker-end="url(#request-arrow)" fill="none"/>
  <circle cx="200" cy="290" r="12" fill="white" stroke="#0078d4" stroke-width="2"/>
  <text x="200" y="294" font-family="Arial" font-size="12" text-anchor="middle">3</text>

  <!-- 4. Cache Operations -->
  <path d="M 200,290 Q 280,400 350,490" stroke="#00b300" stroke-width="2" marker-end="url(#response-arrow)" fill="none"/>
  <path d="M 800,290 Q 720,400 650,490" stroke="#00b300" stroke-width="2" marker-end="url(#response-arrow)" fill="none"/>
  <circle cx="350" cy="490" r="12" fill="white" stroke="#00b300" stroke-width="2"/>
  <text x="350" y="494" font-family="Arial" font-size="12" text-anchor="middle">4</text>

  <!-- 5. Database Replication -->
  <path d="M 260,370 L 600,370" stroke="#ff8c00" stroke-width="2" marker-end="url(#sync-arrow)"/>
  <circle cx="430" cy="370" r="12" fill="white" stroke="#ff8c00" stroke-width="2"/>
  <text x="430" y="374" font-family="Arial" font-size="12" text-anchor="middle">5</text>

  <!-- 6. Monitoring -->
  <path d="M 200,410 Q 350,530 485,650" stroke="#0078d4" stroke-width="1" stroke-dasharray="4,2"/>
  <path d="M 800,410 Q 650,530 485,650" stroke="#0078d4" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="485" cy="650" r="12" fill="white" stroke="#0078d4" stroke-width="2"/>
  <text x="485" y="654" font-family="Arial" font-size="12" text-anchor="middle">6</text>

  <!-- Flow Labels -->
  <g font-family="Arial" font-size="11">
    <text x="440" y="35" fill="#0078d4">1. User Request</text>
    <text x="530" y="110" fill="#0078d4">2. Load Distribution</text>
    <text x="150" y="310" fill="#0078d4">3. App Processing</text>
    <text x="360" y="470" fill="#00b300">4. Cache Operations</text>
    <text x="430" y="350" fill="#ff8c00">5. Geo-Replication</text>
    <text x="485" y="630" fill="#0078d4">6. Monitoring</text>
  </g>

  <!-- Updated Legend -->
  <rect x="780" y="50" width="170" height="120" rx="5" ry="5" fill="#ffffff" stroke="#555555" stroke-width="1"/>
  <text x="790" y="70" font-family="Arial" font-size="12" font-weight="bold">Traffic Flow</text>
  <g transform="translate(790,85)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#0078d4" stroke-width="2" marker-end="url(#request-arrow)"/>
    <text x="25" y="4" font-family="Arial" font-size="10">Request Flow</text>
  </g>
  <g transform="translate(790,105)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#00b300" stroke-width="2" marker-end="url(#response-arrow)"/>
    <text x="25" y="4" font-family="Arial" font-size="10">Cache Operations</text>
  </g>
  <g transform="translate(790,125)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ff8c00" stroke-width="2" marker-end="url(#sync-arrow)"/>
    <text x="25" y="4" font-family="Arial" font-size="10">Replication</text>
  </g>

</svg>